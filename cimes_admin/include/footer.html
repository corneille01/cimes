<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // ===================== CARTE =====================
    const lat = 42.95653825682808;
    const lng = 1.6068379803849264;

    const map = L.map("footer-map", {
      scrollWheelZoom: false,
    }).setView([lat, lng], 13);

    $(window).scroll(function () {
      if ($(document).scrollTop() > 50) {
        $(".nav").addClass("affix");
        console.log("OK");
      } else {
        $(".nav").removeClass("affix");
      }
    });

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        attribution: "&copy; OpenStreetMap &copy; CARTO",
      },
    ).addTo(map);

    const marker = L.marker([lat, lng]).addTo(map);
    marker.bindPopup(
      "<b>Centre universitaire de Foix</b><br>4 Rue Raoul Lafagette, 09000 Foix",
    );

    // ===================== CONTACTS DYNAMIQUES =====================
    const contactContainer = document.getElementById("contact-details");
    const apiUrl = "../cimes_api/index_api.php?query=contact";

    fetch(apiUrl)
      .then((response) => {
        if (!response.ok) throw new Error("Erreur réseau");
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data) || data.length === 0) {
          // Aucun contact → la div reste vide
          return;
        }

        let html = "";
        data.forEach((contact) => {
          html += '<div class="contact-item" style="margin-bottom:12px;">';
          if (contact.nom) {
            html +=
              '<p style="font-weight:600; margin-bottom:6px;">' +
              escapeHtml(contact.nom) +
              "</p>";
          }
          if (contact.email) {
            html +=
              '<p><i class="fas fa-envelope"></i> <a href="mailto:' +
              escapeHtml(contact.email) +
              '">' +
              escapeHtml(contact.email) +
              "</a></p>";
          }
          if (contact.telephone) {
            html +=
              '<p><i class="fas fa-phone-alt"></i> <a href="tel:' +
              escapeHtml(contact.telephone) +
              '">' +
              escapeHtml(contact.telephone) +
              "</a></p>";
          }
          html += "</div>";
        });
        contactContainer.innerHTML = html;
      })
      .catch((error) => {
        console.error("Impossible de charger les contacts :", error);
        // En cas d'erreur, la div reste vide
      });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  });
</script>
